name: Turnstile Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - name: Create widget and set Worker secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: northstar-it-services
          TURNSTILE_DOMAIN: northstar-it-services.frizqon.workers.dev
        run: |
          set -euo pipefail

          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/challenges/widgets" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"northstar-contact\",\"domains\":[\"${TURNSTILE_DOMAIN}\"],\"mode\":\"managed\",\"region\":\"world\"}")

          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "Turnstile API failed:"
            echo "$response" | jq -c '{success,errors}'
            exit 1
          fi

          sitekey=$(echo "$response" | jq -r '.result.sitekey')
          secret=$(echo "$response" | jq -r '.result.secret')

          if [ -z "$sitekey" ] || [ "$sitekey" = "null" ] || [ -z "$secret" ] || [ "$secret" = "null" ]; then
            echo "Turnstile API returned no keys"
            exit 1
          fi

          echo "::add-mask::$secret"

          set_secret() {
            local name="$1"
            local value="$2"
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg name "$name" --arg text "$value" '{name:$name,text:$text,type:"secret_text"}')" \
              | jq -e '.success == true' >/dev/null
          }

          set_secret TURNSTILE_SITE_KEY "$sitekey"
          set_secret TURNSTILE_SECRET_KEY "$secret"

          echo "Turnstile widget configured for ${TURNSTILE_DOMAIN}"
          echo "Site key: ${sitekey}"
