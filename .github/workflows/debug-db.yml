name: Debug DB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inspect database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module -e "
            const u = new URL(process.env.DATABASE_URL);
            console.log('host=' + u.host);
            console.log('database=' + u.pathname);
            const { neon } = await import('@neondatabase/serverless');
            const sql = neon(process.env.DATABASE_URL);
            const tables = await sql\`SELECT table_schema, table_name FROM information_schema.tables WHERE table_name IN ('site_content','contact_messages','schema_migrations') ORDER BY table_name\`;
            console.log('tables=' + JSON.stringify(tables));
            const migrations = await sql\`SELECT version FROM public.schema_migrations ORDER BY version\`;
            console.log('migrations=' + JSON.stringify(migrations));
          "
