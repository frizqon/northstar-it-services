name = "northstar-it-services"
main = "src/worker/index.ts"
compatibility_date = "2026-05-03"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "20261108"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"

